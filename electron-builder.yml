appId: com.ellinglien.sssketch
productName: sssketch
directories:
  buildResources: build
afterPack: build/afterPack.js
# An allowlist: only what the packaged app reads goes into app.asar. Until
# 2026-10-07 this was a short blocklist on top of electron-builder's
# include-everything default, and every release carried the repo with it --
# the engine and bridge CMake build dirs (JUCE _deps and all), docs/, test
# stems, CLAUDE.md -- for a 488 MB app.asar where the app itself is ~17 MB
# (share-readiness audit B2,
# docs/superpowers/specs/2026-10-07-share-readiness-audit.md).
#   - out/: the built main, preload and renderer (the renderer bundle carries
#     onnxruntime-web's wasm itself, so that package is a devDependency).
#   - resources/icon.png: main's `?asset` import resolves it next to out/.
#   - Production node_modules are added by electron-builder whatever this
#     list says; better-sqlite3's C sources are not needed at runtime (its
#     prebuilt .node files are, and are unpacked from the asar automatically).
# Everything else in resources/ ships through extraResources below, read from
# process.resourcesPath -- so there's no asarUnpack of resources/ any more
# (it shipped that folder twice).
# The engine and bridge .apps also ship through extraResources, never asar.
files:
  - out/**
  - package.json
  - resources/icon.png
  - LICENSE
  - '!node_modules/better-sqlite3/{deps,src}/**'
extraResources:
  - from: native-engine/build/sssketch_engine_artefacts/sssketch-engine.app
    to: native-engine/sssketch-engine.app
  - from: native-engine-bridge/build/sssketch_bridge_artefacts/sssketch-bridge.app
    to: native-engine-bridge/sssketch-bridge.app
  # Produced by scripts/vendor-rubberband.sh (run in CI before packaging,
  # see release.yml) -- a relocatable copy of the rubberband CLI + its
  # dylib dependencies, so tempo stretching works with zero setup instead
  # of requiring every tester to `brew install rubberband` themselves.
  - from: resources/rubberband
    to: rubberband
  # Produced by scripts/vendor-yamnet.sh (run in CI before packaging, see
  # release.yml's "Vendor YAMNet" step, which also checks the packaged app
  # has it) -- the YAMNet ONNX model used for stem-similarity embeddings
  # (src/main/yamnetModel.ts). Gitignored, not committed -- ~16MB, fetched
  # at vendor time rather than bloating a now-public repo. Releases up to
  # 1.4.0 shipped without it: the step was never added.
  - from: resources/yamnet
    to: yamnet
  - from: resources/demo-rifff
    to: demo-rifff
win:
  executableName: sssketch
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.music
  # Deliberately a bare target name, NOT `{ target: dmg, arch: [...] }` --
  # a real, confirmed bug (not a guess) was caught by tracing
  # app-builder-lib's own computeArchToTargetNamesMap (targets/
  # targetFactory.js) AND by observing it live in a real CI run: when a
  # target entry's own `arch` list is explicitly set (even to both archs),
  # THAT list wins outright, regardless of the CLI's own --arm64/--x64
  # flag -- so a matrix leg invoked with `--x64` still built BOTH arm64
  # AND x64 DMGs, each leg's "wrong" arch pass silently pairing a
  # correctly-fetched Electron shell for that arch with THAT SAME LEG's
  # own single-arch native-engine build (only ever built for the leg's
  # intended arch), producing a broken shell/engine architecture
  # mismatch. Confirmed directly against the installed electron-builder
  # source: computeArchToTargetNamesMap([{target:'dmg'}], ..., '--x64')
  # correctly resolves to ONLY x64, while the same call with an explicit
  # `arch: ['arm64','x64']` resolves to BOTH regardless of the CLI flag.
  # Omitting `arch` here lets each leg's own CLI flag be the only source
  # of truth, with no zip-collision risk either (verified the same way --
  # an arch-less bare target resolves to exactly ['dmg'] for whichever
  # arch the CLI specifies, never falling through to the framework's
  # ['zip','dmg'] default).
  target:
    - dmg
    - zip
  # EVERY mac artifact carries its architecture, with no exceptions -- this
  # is load-bearing for auto-update, not cosmetic. electron-updater decides
  # which file a given Mac downloads purely by looking for "arm64"/"x64" in
  # the file NAME (MacUpdater.filterFilesForArch, then findFile in
  # providers/Provider.js -- both quoted in the spec below); the update feed
  # format has no architecture field for it to read instead. Until 2026-09-27
  # the arm64 build shipped as sssketch-X.Y.Z.dmg / -mac.zip with no arch
  # anywhere in the name, which left an Apple Silicon Mac picking by array
  # order out of a feed listing both builds.
  #
  # Setting artifactName here (rather than relying on defaultArch below to
  # suppress one suffix) also makes the suffix unconditional: traced in
  # app-builder-lib's platformPackager.js, a user-supplied pattern sets
  # isUserForced, and expandArtifactNamePattern then passes the real arch
  # through regardless of defaultArch.
  #
  # Renames the arm64 artifacts from v1.3.1 onward (sssketch-X.Y.Z-arm64.dmg,
  # was sssketch-X.Y.Z.dmg) and drops the "-mac" the zips used to carry;
  # the x64 dmg name is unchanged. Already-published releases keep their own
  # asset names -- those links still work. See
  # docs/superpowers/specs/2026-09-27-mac-update-feed-both-arches-design.md.
  artifactName: ${name}-${version}-${arch}.${ext}
  # Now only decides the local output DIRECTORY layout (dist/mac for arm64,
  # dist/mac-x64 for the other leg) -- artifactName above has taken over
  # naming. Its original purpose was the opposite of the line above: keeping
  # the arm64 filenames unsuffixed, which is exactly what the auto-update bug
  # turned out to need undone. See
  # docs/superpowers/specs/2026-08-11-intel-permanent-release-target-design.md
  # for the original reasoning.
  defaultArch: arm64
  entitlementsInherit: build/entitlements.mac.plist
  # Paths build/afterPack.js already signs itself (with its own distinct
  # entitlements.engine.plist, not this file's entitlementsInherit -- see
  # that hook's own doc comment for the full rationale). Without this,
  # electron-builder's own signing pass (which runs AFTER afterPack, right
  # before notarizing) walks the entire Contents tree via @electron/osx-sign
  # and unconditionally re-signs every nested .app/.framework/Mach-O it
  # finds -- including these -- with the generic inherited entitlements,
  # silently overwriting afterPack.js's own signature and stripping the
  # engine's disable-library-validation entitlement right before the app
  # gets sealed and notarized. signIgnore tells that pass to leave these
  # exact paths alone, so afterPack.js's signature is the only one that
  # ever gets applied to them, and the outer app's own seal (computed after
  # signIgnore skips over them) is self-consistent.
  signIgnore:
    - 'Contents/Resources/native-engine/'
    - 'Contents/Resources/native-engine-bridge/'
    - 'Contents/Resources/rubberband/'
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: true
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: ellinglien
  repo: sssketch
