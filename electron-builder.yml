appId: com.ellinglien.sssketch
productName: sssketch
directories:
  buildResources: build
afterSign: build/afterSign.js
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
extraResources:
  - from: native-engine/build/sssketch_engine_artefacts/sssketch-engine.app
    to: native-engine/sssketch-engine.app
  - from: native-engine-bridge/build/sssketch_bridge_artefacts/sssketch-bridge.app
    to: native-engine-bridge/sssketch-bridge.app
  # Produced by scripts/vendor-rubberband.sh (run in CI before packaging,
  # see release.yml) -- a relocatable copy of the rubberband CLI + its
  # dylib dependencies, so tempo stretching works with zero setup instead
  # of requiring every tester to `brew install rubberband` themselves.
  - from: resources/rubberband
    to: rubberband
win:
  executableName: sssketch
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.music
  target:
    - target: dmg
      arch:
        - arm64
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: ellinglien
  repo: sssketch
