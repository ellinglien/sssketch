    <!--
      font-src needs data: because the two Silkscreen faces below are embedded
      as base64 data URIs. Without it they are blocked and the whole app silently
      renders in the ui-monospace fallback -- which is exactly what every packaged
      build did before 2026-09-25: Vite inlines any asset under assetsInlineLimit
      (4096 bytes) and both faces are smaller than that, so the production CSS
      bundle always held data: URIs that default-src self refused to load.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"
    />
    <!--
      The faces live here, inline in the document head, rather than in
      global.css. global.css is reached through main.tsx, so the browser could
      not even know Silkscreen existed until the entire renderer module graph had
      been fetched, parsed and executed: measured cold on 2026-09-25, main.tsx
      landed at 148ms, global.css at 279ms, and the actual woff2 request did not
      start until 930ms -- with the whole chain taking 3.28s on a genuinely cold
      dev server. Declaring them in the head makes the font part of the first CSS
      the parser sees, before any script runs, and embedding the bytes means there
      is no second request to wait on at all. 7.2KB of woff2, ~9.6KB base64.

      font-display block, not swap: the bytes are already in the document, so the
      block period is a frame or two of nothing rather than a visible flash of the
      wrong typeface.

      These two base64 blobs must stay byte-identical to the woff2 files under
      src/renderer/src/assets/fonts/, which remain the source of truth.
      src/renderer/src/styles/inlineFonts.test.ts fails if they drift.
    -->
