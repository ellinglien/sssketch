# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - 'v*'

# Needed for electron-builder's github publish provider to create a Release
# and upload artifacts using the automatically-provided GITHUB_TOKEN, with no
# separate PAT secret required.
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # TEMPORARY diagnostic: loreWarehouse.test.ts's whole vitest worker
      # dies with no test-level error on this runner ("Worker exited
      # unexpectedly") across 3 consecutive real runs -- always this exact
      # file, unaffected by capping maxWorkers -- while passing clean
      # locally, and better-sqlite3 (its native addon) loads fine standalone
      # here. This isolates the file from every other test (no other file
      # sharing its worker, no native-engine build needed) to tell apart
      # "crashes even alone on this runner" from "only crashes alongside
      # other subprocess-spawning tests" before guessing at a real fix.
      # Placed before the slow native build for fast iteration. Remove once
      # root-caused. Verbose reporter + `|| true` so a crash here doesn't
      # fail the job early -- we want its raw output, not the job's
      # normal test run to change.
      - name: Diagnose loreWarehouse.test.ts in isolation
        run: npx vitest run src/main/loreWarehouse.test.ts --reporter=verbose || true

      # JUCE (fetched via CMake's FetchContent, pinned to git tag 8.0.4 in
      # native-engine/CMakeLists.txt) takes 10-15 minutes to fetch+build from
      # scratch -- this cache keeps that a one-time cost per JUCE version /
      # native-engine source change, not a per-release cost.
      - name: Cache native engine build
        uses: actions/cache@v4
        with:
          path: native-engine/build
          key: native-engine-${{ runner.os }}-juce-8.0.4-${{ hashFiles('native-engine/CMakeLists.txt', 'native-engine/Source/**') }}

      - name: Build native engine
        working-directory: native-engine
        run: |
          cmake -B build
          cmake --build build --config Release

      # Installed here, before Test -- render-parity.test.ts spawns the real
      # `rubberband` CLI (see src/main/rubberband.ts), and the runner has no
      # Homebrew install of its own by default. Vendoring (below) needs the
      # same install, so this one covers both rather than installing twice.
      - name: Install rubberband
        run: brew install rubberband

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run

      # Produces resources/rubberband/ (gitignored, rebuilt fresh per
      # release -- see scripts/vendor-rubberband.sh's own doc comment for
      # why this isn't committed) so tempo stretching works out of the box
      # for testers with no Homebrew install of their own.
      - name: Vendor rubberband
        run: bash scripts/vendor-rubberband.sh

      # electron-builder handles CSC_LINK (base64-encoded .p12)/CSC_KEY_PASSWORD
      # itself -- imports into a temporary keychain internally, no manual
      # `security import`/keychain scripting needed here. CSC_NAME selects
      # which identity to use (also read directly by build/afterSign.js for
      # signing the nested engine bundle -- see build/afterSign.js). notarize:
      # true in electron-builder.yml (only set once real Apple credentials are
      # in place -- see the implementation plan's Task 11) is what actually
      # triggers notarization using the APPLE_* vars below.
      - name: Build, sign, notarize, and publish
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-vite build
          npx electron-builder --mac --publish always
