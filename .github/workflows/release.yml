# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - 'v*'

# Needed for electron-builder's github publish provider to create a Release
# and upload artifacts using the automatically-provided GITHUB_TOKEN, with no
# separate PAT secret required.
permissions:
  contents: write

jobs:
  # electron-builder's Github publisher checks "does a release for this tag
  # exist yet?" and creates one if not -- but each matrix leg's own job runs
  # TWO of these checks concurrently (one per uploaded asset, e.g. the .dmg
  # and its .blockmap), and both can see "doesn't exist" before either
  # finishes creating one. Reproduced on every release so far: sometimes
  # both concurrent creates crash electron-builder outright (a malformed
  # response body it can't parse), and sometimes both succeed, silently
  # splitting the tag's assets across two separate draft releases. Having
  # every matrix leg depend on this job pre-creating the release means
  # electron-builder's own "doesn't exist" check always finds one already
  # there, so it never has anything to race to create.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Pre-create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists -- skipping create (idempotent, e.g. a rerun)"
          else
            gh release create "$TAG" --draft --title "$VERSION" --notes ""
          fi

  release:
    needs: create-release
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # JUCE (fetched via CMake's FetchContent, pinned to git tag 8.0.4 in
      # native-engine/CMakeLists.txt) takes 10-15 minutes to fetch+build from
      # scratch -- this cache keeps that a one-time cost per JUCE version /
      # native-engine source change, not a per-release cost.
      - name: Cache native engine build
        uses: actions/cache@v4
        with:
          path: native-engine/build
          key: native-engine-${{ runner.os }}-${{ matrix.arch }}-juce-8.0.4-${{ hashFiles('native-engine/CMakeLists.txt', 'native-engine/Source/**') }}

      # Each matrix leg gets its own isolated runner VM, so native-engine
      # builds into its normal path on every leg -- no separate build
      # directory needed the way the local x64 test build required (that
      # ran on one machine juggling both an arm64 dev build and an x64 test
      # build at once; CI legs never share a machine). The arm64 leg builds
      # natively (unchanged); the x64 leg cross-compiles via
      # CMAKE_OSX_ARCHITECTURES, already proven to produce a genuine x86_64
      # engine binary in this session's local test build.
      - name: Build native engine
        working-directory: native-engine
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then
            cmake -B build -DCMAKE_OSX_ARCHITECTURES=x86_64
          else
            cmake -B build
          fi
          cmake --build build --config Release

      # A separate x86_64-only build (see native-engine-bridge/CMakeLists.txt's
      # own doc comment) that lets the arm64 engine retry scanning Intel-only
      # VST3/AU plugins under Rosetta. electron-builder.yml's extraResources
      # references its .app bundle directly -- packaging fails outright if
      # this was never built (caught for real: a release run got all the way
      # through every other step and failed here with a confusing
      # "not a file" error once electron-builder tried to copy a
      # nonexistent path). Its own separate JUCE fetch, so its own cache key.
      - name: Cache native engine bridge build
        uses: actions/cache@v4
        with:
          path: native-engine-bridge/build
          key: native-engine-bridge-${{ runner.os }}-juce-8.0.4-${{ hashFiles('native-engine-bridge/CMakeLists.txt', 'native-engine-bridge/Source/**', 'native-engine/Source/SharedRingBuffer.*', 'native-engine/Source/SharedAudioChannel.*', 'native-engine/Source/PluginArchitecture.*', 'native-engine/Source/PluginScanning.*') }}

      - name: Build native engine bridge
        working-directory: native-engine-bridge
        run: |
          cmake -B build
          cmake --build build --config Release

      # Installed here, before Test -- render-parity.test.ts spawns the real
      # `rubberband` CLI (see src/main/rubberband.ts), and the runner has no
      # Homebrew install of its own by default. Vendoring (below) needs the
      # same install, so this one covers both rather than installing twice.
      - name: Install rubberband
        run: brew install rubberband

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run

      # Produces resources/rubberband/ (gitignored, rebuilt fresh per
      # release -- see scripts/vendor-rubberband.sh's own doc comment for
      # why this isn't committed) so tempo stretching works out of the box
      # for testers with no Homebrew install of their own.
      #
      # arm64: vendor the same host-installed Homebrew binary as before
      # (brew install rubberband ran earlier in this job, for Test).
      # x64: GitHub's arm64 runners have no Rosetta 2 (confirmed against
      # the current actions/runner-images README), so `arch -x86_64 brew
      # install` isn't safe here -- fetch and relocate the x86_64 bottle
      # directly instead (see scripts/fetch-x64-rubberband.py's own doc
      # comment for the three real gotchas that mechanism required --
      # including Homebrew's ongoing, formula-by-formula withdrawal of
      # Intel macOS bottles, which is a countdown on this whole leg).
      - name: Vendor rubberband
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then
            RUBBERBAND_BIN="$(python3 scripts/fetch-x64-rubberband.py "$RUNNER_TEMP/rubberband-x64")"
            bash scripts/vendor-rubberband.sh "$RUBBERBAND_BIN"
          else
            bash scripts/vendor-rubberband.sh
          fi

      # electron-builder can handle CSC_LINK (base64-encoded .p12)/
      # CSC_KEY_PASSWORD itself for ITS OWN signing pass -- but it only
      # imports the cert into a keychain lazily, the first time that pass
      # touches it (doSignAfterPack, which runs AFTER afterPack fires -- see
      # app-builder-lib's macPackager.js, `codeSigningInfo` MemoLazy).
      # build/afterPack.js's own `codesign` call runs BEFORE that (see its
      # doc comment for why), so by the time it runs in CI, no keychain has
      # the identity yet and it fails with "no identity found" -- never
      # reproduces locally, where the real cert already sits in the login
      # keychain. The "Import signing certificate" step below imports it
      # ourselves, ahead of everything, so it's already available
      # regardless of which signing pass touches it first.
      #
      # That second, redundant electron-builder import used to be harmless.
      # It is not any more, and it is why the v1.2.0 release run's arm64
      # leg died at "/usr/bin/security process failed 1 ...
      # SecKeychainUnlock: The user name or passphrase you entered is not
      # correct" against a random-hash keychain in TMPDIR (electron-
      # builder's own, not ours). Traced into app-builder-lib 26.15.3's
      # macCodeSign.js: createKeychain() makes its temp keychain with a
      # `randomBytes(32)` password, then importCerts() runs
      # `security set-key-partition-list ... -k <cscKeyPassword>` -- the
      # .p12's OWN password, NOT the keychain password it just generated.
      # Those two can never match. It only ever passed because `security`
      # used to tolerate a bad -k on an already-unlocked keychain; on the
      # current runner image (Darwin 25.6.0; the last green release,
      # v1.1.22, ran on 25.5.0 with the identical electron-builder 26.15.3
      # and identical secrets) it exits 1 instead. Nothing in this repo,
      # in electron-builder's pinned version, or in the signing secrets
      # changed -- the p12 and its password are provably still good, since
      # our own import step below and afterPack.js's real `codesign` runs
      # both succeeded in that same failed run.
      #
      # So: do NOT give electron-builder CSC_LINK/CSC_KEY_PASSWORD at all.
      # With no cscLink, macPackager's codeSigningInfo short-circuits to
      # `{ keychainFile: process.env.CSC_KEYCHAIN || null }` -- no second
      # import, no createKeychain, no set-key-partition-list -- and that
      # keychainFile is threaded through findIdentity (`security
      # find-identity -v <keychain>`), @electron/osx-sign's `keychain`
      # option and dmg-builder's own `codesign --keychain`, all resolving
      # the identity by CSC_NAME out of the keychain we already built.
      # Notarization is untouched: notarizeIfProvided() reads only the
      # APPLE_* vars.
      #
      # CSC_NAME selects which identity to use -- must be the bare common
      # name (e.g. "Elling Lien (TEAMID)"), NOT prefixed with "Developer ID
      # Application:" (a real electron-builder rejection hit once: "Please
      # remove prefix ... — appropriate certificate will be chosen
      # automatically"). Also read directly by build/afterPack.js for
      # signing the nested engine bundle with its own entitlements (see
      # that hook's own doc comment for why it runs in afterPack, not
      # afterSign, and why mac.signIgnore in electron-builder.yml has to
      # pair with it). notarize: true in electron-builder.yml is what
      # actually triggers notarization using the APPLE_* vars below.
      #
      # GitHub Actions sets a referenced-but-missing secret to an EMPTY
      # STRING, not an omitted var, even once real secrets exist for SOME
      # of these names but not others. electron-builder's own CSC_LINK
      # handling treats a non-null empty string as "resolve this as a real
      # certificate file path" (its own code comment: "allow to specify as
      # empty string"), which resolves to the checkout root itself and
      # fails packaging outright with a confusing "not a file" error --
      # caught for real, traced into app-builder-lib's own source.
      # `unset`-ing each var when blank keeps afterPack.js's own "skip
      # gracefully when not set" behavior correct at the electron-builder
      # level too, regardless of which subset of these secrets happen to
      # be configured at any given time.
      - name: Import signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # secrets can't be referenced directly in a step's `if:` (not an
          # available context there), so the skip-when-unset guard lives
          # here instead, matching the same pattern the next step uses.
          if [ -z "$CSC_LINK" ]; then
            echo "CSC_LINK not set, skipping certificate import (unsigned/local build)"
            exit 0
          fi

          CERT_PATH="$RUNNER_TEMP/signing-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          echo -n "$CSC_LINK" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to the search list (rather than relying on -k everywhere)
          # so both afterPack.js's plain `codesign --sign` call and
          # electron-builder's own later signing pass find the identity.
          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/"//g')
          # shellcheck disable=SC2086  # word-splitting is intentional: each existing keychain is its own arg
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          rm -f "$CERT_PATH"
          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          # Print-only (never fails the step). electron-builder resolves the
          # identity with exactly this call now that CSC_KEYCHAIN points it
          # here instead of letting it build its own keychain -- so if a
          # future run reports "no identity found", this line is the
          # difference between "the cert expired / the chain didn't validate"
          # and "the keychain wiring is wrong", with no guessing.
          echo "identities visible in the signing keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true

      # No CSC_LINK/CSC_KEY_PASSWORD here on purpose -- see the long comment
      # on "Import signing certificate" above. CSC_KEYCHAIN (set from
      # SIGNING_KEYCHAIN_PATH in the run script below, so it stays empty and
      # harmless on an unsigned local/fork build) points electron-builder at
      # the keychain that step already populated.
      - name: Build, sign, notarize, and publish
        env:
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # set +e here: this step's shell runs with `bash -e`, and
          # `[ -z "$VAR" ]` evaluating false (VAR is actually set, the
          # future case once real secrets exist) would otherwise abort the
          # whole script under errexit even though nothing is wrong.
          set +e
          [ -z "$CSC_NAME" ] && unset CSC_NAME
          [ -z "$APPLE_ID" ] && unset APPLE_ID
          [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] && unset APPLE_APP_SPECIFIC_PASSWORD
          [ -z "$APPLE_TEAM_ID" ] && unset APPLE_TEAM_ID
          set -e

          # Only exported when the import step actually ran (it writes
          # SIGNING_KEYCHAIN_PATH to $GITHUB_ENV only after a successful
          # import), so an unsigned local/fork build leaves CSC_KEYCHAIN
          # unset and electron-builder's keychainFile stays null, exactly
          # as before.
          if [ -n "${SIGNING_KEYCHAIN_PATH:-}" ]; then
            export CSC_KEYCHAIN="$SIGNING_KEYCHAIN_PATH"
          fi

          npx electron-vite build
          npx electron-builder --mac --publish always ${{ matrix.arch == 'x64' && '--x64' || '--arm64' }}

      # The runner VM is destroyed after the job regardless, but deleting
      # the keychain (and its search-list entry) explicitly is the
      # standard hygiene for a manually-imported signing cert. if: always()
      # so this still runs if an earlier step in the job failed.
      - name: Clean up signing keychain
        if: always()
        run: |
          if [ -n "$SIGNING_KEYCHAIN_PATH" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          fi
